version: "3.9"

services:
  ticketwave_mysql:
    image: mysql:8.0
    container_name: ticketwave_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: ticketwave
      MYSQL_USER: ticketwave
      MYSQL_PASSWORD: ticketwave
      TZ: America/La_Paz
    ports:
      - "3306:3306"
    volumes:
      - ticketwave_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketwave_network

  ticketwave_redis:
    image: redis:7-alpine
    container_name: ticketwave_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ticketwave_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketwave_network

  ticketwave_rabbitmq:
    image: rabbitmq:4-management
    container_name: ticketwave_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ticketwave_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketwave_network

  ticketwave_api:
    image: node:20-alpine
    container_name: ticketwave_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../soe-ticket-api:/app
      - ticketwave_api_node_modules:/app/node_modules
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: ticketwave_mysql
      DB_PORT: 3306
      DB_USER: ticketwave
      DB_PASSWORD: ticketwave
      DB_NAME: ticketwave
      REDIS_HOST: ticketwave_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RABBITMQ_HOST: ticketwave_rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_REFRESH_SECRET: change-this-to-another-long-random-secret
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      ticketwave_mysql:
        condition: service_healthy
      ticketwave_redis:
        condition: service_healthy
      ticketwave_rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - ticketwave_network

  ticketwave_ordering:
    image: node:20-alpine
    container_name: ticketwave_ordering
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../soe-ticket-ordering-service:/app
      - ticketwave_ordering_node_modules:/app/node_modules
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: ticketwave_mysql
      DB_PORT: 3306
      DB_USER: ticketwave
      DB_PASSWORD: ticketwave
      DB_NAME: ticketwave_ordering
      REDIS_HOST: ticketwave_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 1
      RABBITMQ_HOST: ticketwave_rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3001:3001"
    depends_on:
      ticketwave_mysql:
        condition: service_healthy
      ticketwave_redis:
        condition: service_healthy
      ticketwave_rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - ticketwave_network

  ticketwave_kong:
    image: kong:3.6
    container_name: ticketwave_kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      ticketwave_api:
        condition: service_healthy
      ticketwave_ordering:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketwave_network

volumes:
  ticketwave_mysql_data:
  ticketwave_redis_data:
  ticketwave_rabbitmq_data:
  ticketwave_api_node_modules:
  ticketwave_ordering_node_modules:

networks:
  ticketwave_network:
    name: ticketwave_network
